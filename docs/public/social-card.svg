<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Get MWAA Environment</title>
  <desc id="desc">Social card for the mwaa-get-env-action GitHub Action: a workflow step that reads an Amazon MWAA environment, and the step outputs it produces, such as status AVAILABLE and Airflow version 2.10.3.</desc>
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c37b"/>
      <stop offset="0.55" stop-color="#ee9a56"/>
      <stop offset="1" stop-color="#d98080"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7b955"/>
      <stop offset="1" stop-color="#ee9a56"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#ff9900" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="#0d1117"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- logo tile: a status gauge whose needle sits in the green zone -->
  <g transform="translate(76 77) scale(0.9375)">
    <rect x="4" y="4" width="56" height="56" rx="12" fill="#1b2a41"/>
    <g transform="translate(0 -3)"><g fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M16 42A16 16 0 0 1 40 28.14" stroke="#f97316"/>
      <path d="M40 28.14A16 16 0 0 1 48 42" stroke="#3fb950"/>
      <path d="M32 42L41.2 34.3" stroke="#e6edf3"/>
    </g>
    <circle cx="32" cy="42" r="3.4" fill="#e6edf3"/><circle cx="48" cy="42" r="4" fill="#3fb950"/><circle cx="49.2" cy="40.8" r="1" fill="#1b2a41"/></g>
  </g>

  <g font-family="'Segoe UI', 'Noto Sans', Arial, 'DejaVu Sans', sans-serif">
    <text x="80" y="232" font-size="80" font-weight="700" fill="url(#titleGrad)">Get MWAA</text>
    <text x="80" y="318" font-size="80" font-weight="700" fill="url(#titleGrad)">Environment</text>

    <text x="80" y="376" font-size="26" fill="#c9d1d9">Read an Amazon MWAA environment's status,</text>
    <text x="80" y="412" font-size="26" fill="#c9d1d9">Airflow version and S3 paths as step outputs.</text>

    <rect x="80" y="445" width="190" height="4" rx="2" fill="url(#barGrad)"/>

    <text x="80" y="548" font-family="ui-monospace, Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#8b949e">lowlysre/mwaa-get-env-action</text>
    <text x="80" y="580" font-size="17" fill="#6e7681">Not affiliated with AWS.</text>
  </g>

  <!-- workflow snippet card: the step, then the outputs it sets -->
  <rect x="690" y="96" width="510" height="452" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <line x1="690" y1="152" x2="1200" y2="152" stroke="#30363d" stroke-width="2"/>
  <circle cx="717" cy="124" r="6" fill="#f85149"/>
  <circle cx="739" cy="124" r="6" fill="#d29922"/>
  <circle cx="761" cy="124" r="6" fill="#3fb950"/>

  <g xml:space="preserve" font-family="ui-monospace, Consolas, 'DejaVu Sans Mono', monospace" font-size="18">
    <text x="718" y="194"><tspan fill="#8b949e">-</tspan><tspan fill="#4493f8"> id:</tspan><tspan fill="#3fb950"> mwaa</tspan></text>
    <text x="718" y="226"><tspan fill="#ff9900">  uses: lowlysre/mwaa-get-env-action@v1</tspan></text>
    <text x="718" y="258" fill="#4493f8">  with:</text>
    <text x="718" y="290"><tspan fill="#4493f8">    name:</tspan><tspan fill="#3fb950"> my-environment</tspan></text>

    <text x="718" y="350" fill="#8b949e"># steps.mwaa.outputs</text>
    <text x="718" y="384"><tspan fill="#4493f8">status             </tspan><tspan fill="#3fb950">AVAILABLE</tspan></text>
    <text x="718" y="414"><tspan fill="#4493f8">airflow-version    </tspan><tspan fill="#e6edf3">2.10.3</tspan></text>
    <text x="718" y="444"><tspan fill="#4493f8">environment-class  </tspan><tspan fill="#e6edf3">mw1.small</tspan></text>
    <text x="718" y="474"><tspan fill="#4493f8">dag-s3-path        </tspan><tspan fill="#e6edf3">dags</tspan></text>
    <text x="718" y="504"><tspan fill="#4493f8">last-update-status </tspan><tspan fill="#3fb950">SUCCESS</tspan></text>
  </g>
</svg>
