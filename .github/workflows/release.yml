name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the build provenance with Sigstore
      attestations: write # store the provenance attestation
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >-
            github.com:443
            api.github.com:443
            uploads.github.com:443
            registry.npmjs.org:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # release builds never restore a cache another workflow could have written

      - name: Configure npm
        uses: lowlydba/sustainable-npm@4cc1da285e5a589a7b3816122f791c21ec6ff3e6 # v4.0.0

      - name: Install dependencies
        run: npm ci

      - name: Type check, test, and build
        run: npm run check

      - name: Require the committed dist/ to match the build
        run: |
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "::error::dist/ at this tag doesn't match a fresh build. Rebuild, commit, and tag again."
            exit 1
          fi

      - name: Package the action
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="mwaa-get-env-action-${TAG}"
          mkdir release
          git archive --format=tar.gz --prefix="${name}/" -o "release/${name}.tar.gz" HEAD -- action.yml dist LICENSE NOTICE README.md
          (cd release && sha256sum -- *.tar.gz > SHA256SUMS)

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tar.gz

      - name: Publish the release
        env:
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp -- "$BUNDLE" "release/mwaa-get-env-action-${TAG}.sigstore.json"
          # gh uploads the assets to a draft and then publishes it, which immutable releases require.
          gh release create "$TAG" release/* --verify-tag --title "$TAG" --generate-notes
